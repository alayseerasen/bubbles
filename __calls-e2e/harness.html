<!doctype html>
<html>
<head><meta charset="utf-8"><title>calls e2e</title></head>
<body style="margin:0;display:flex;gap:8px;">
<iframe id="a" src="side.html?me=user_a" width="420" height="560"></iframe>
<iframe id="b" src="side.html?me=user_b" width="420" height="560"></iframe>
<script>
const frames = [document.getElementById("a"), document.getElementById("b")];

addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.kind === "bc") frames.forEach(f => f.contentWindow.postMessage(d, "*"));
});

window.A = () => frames[0].contentWindow.__api();
window.B = () => frames[1].contentWindow.__api();
window.ctrl = {
    call: (id) => frames[0].contentWindow.startDirectCall(id),
    accept: () => frames[1].contentWindow.acceptIncomingCall(),
    decline: () => frames[1].contentWindow.declineIncomingCall(),
    camA: () => frames[0].contentWindow.toggleCam(),
    screenA: () => frames[0].contentWindow.toggleScreenShare(),
    hangA: () => frames[0].contentWindow.hangUpCall()
};
</script>
</body>
</html>
