<!--
  iOS-specific PWA tags. Web Push on iPhone ONLY works inside a web app
  that was added to the Home Screen вЂ” a normal Safari tab can never
  receive push, no matter what the JS does. These three tags are what
  makes "РџРѕРґРµР»РёС‚СЊСЃСЏ в†’ РќР° СЌРєСЂР°РЅ Р”РѕРјРѕР№" actually create a standalone app
  (its own window, no Safari chrome, correct status bar) instead of just
  a bookmark that reopens inside Safari:
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubbles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Fredoka for headings/logo (round, bubble-lettered вЂ” matches the
  Frutiger Aero/Y2K look far more honestly than faking it with Arial +
  negative letter-spacing) and Nunito for body text (same font already
  used on Aero World, for a consistent feel between the two).
-->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
// Apply saved theme immediately, before CSS paints, to avoid a flash of the wrong theme.
(function(){
    try{
        var saved = localStorage.getItem("bubbles-theme");
        document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
    }catch(e){}
})();
</script>
<link rel="stylesheet" href="css/style.css?v=23">
<script src="js/events.js?v=2"></script>

<body>

<!--
    Static skeleton вЂ” shown the instant the HTML parses, before app.js
    has even finished downloading, let alone run startApp()/loadDB().
    renderApp() (or the auth screen) overwrites #app's innerHTML the
    moment either one is ready, so this never lingers once there's
    real content to show вЂ” but until then, #app was simply EMPTY,
    meaning every single visit opened to a blank page for however long
    auth + the initial data fetch took.
-->
<div id="app">
    <div class="initial-skeleton">
        <div class="initial-skeleton-logo">рџ«§ bubbles</div>

        <div class="skeleton" style="width:100%;height:90px;border-radius:22px;"></div>
    </div>
</div>

<!--
  CACHE-BUSTING: every local script/style below carries ?v=N. iOS
  "Add to Home Screen" apps in particular cache extremely aggressively
  and often won't pick up new code on a normal reload вЂ” bumping this
  number on every deploy forces the browser to treat the file as new
  and fetch it fresh, instead of quietly continuing to run old code
  while looking like nothing changed. BUMP THIS EVERY TIME YOU UPDATE
  A FILE (css/style.css, any js/*.js, or sw.js).
-->
