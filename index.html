<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>bubbles</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#64d9fa">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<!--
  iOS-specific PWA tags. Web Push on iPhone ONLY works inside a web app
  that was added to the Home Screen — a normal Safari tab can never
  receive push, no matter what the JS does. These three tags are what
  makes "Поделиться → На экран Домой" actually create a standalone app
  (its own window, no Safari chrome, correct status bar) instead of just
  a bookmark that reopens inside Safari:
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubbles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Fredoka for headings/logo (round, bubble-lettered — matches the
  Frutiger Aero/Y2K look far more honestly than faking it with Arial +
  negative letter-spacing) and Nunito for body text (same font already
  used on Aero World, for a consistent feel between the two).
-->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
// Apply saved theme immediately, before CSS paints, to avoid a flash of the wrong theme.
(function(){
    try{
        var saved = localStorage.getItem("bubbles-theme");
        document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
    }catch(e){}
})();
</script>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<div id="app"></div>

<!-- GLOBAL AUDIO PLAYER -->
<div id="globalPlayer" class="global-player hidden">
    <div class="global-player-top">
        <div class="global-player-info">
            <img id="globalPlayerCover" src="" alt="">
            <div class="global-player-text">
                <div id="globalPlayerTitle">Ничего не играет</div>
                <div id="globalPlayerArtist"></div>
            </div>
        </div>
        <button onclick="closeMusicPlayer()" title="Закрыть">✕</button>
    </div>
    <div class="global-player-controls">
        <button onclick="playPrevTrack()" title="Предыдущий трек">⏮️</button>
        <audio id="globalAudio" controls preload="metadata"></audio>
        <button onclick="playNextTrack()" title="Следующий трек">⏭️</button>
    </div>
</div>

<!-- FLOATING CALL BAR (звонки) -->
<div id="callBar" class="call-bar hidden"></div>

<div id="toastContainer"></div>

<!--
  CACHE-BUSTING: every local script/style below carries ?v=N. iOS
  "Add to Home Screen" apps in particular cache extremely aggressively
  and often won't pick up new code on a normal reload — bumping this
  number on every deploy forces the browser to treat the file as new
  and fetch it fresh, instead of quietly continuing to run old code
  while looking like nothing changed. BUMP THIS EVERY TIME YOU UPDATE
  A FILE (css/style.css, any js/*.js, or sw.js).
-->
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=2"></script>
<script src="js/push-config.js?v=2"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/crypto.js?v=2"></script>
<script src="js/sounds.js?v=1"></script>
<script src="js/image-cropper.js?v=1"></script>
<script src="js/app.js?v=6"></script>
<script src="js/calls.js?v=3"></script>
</body>
</html>
